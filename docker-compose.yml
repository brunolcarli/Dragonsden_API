services:
  dragonsden:
    image: dragonsden_api:devel
    build: .
    restart: on-failure
    command: >
      sh -c "
      python manage.py migrate &&
      gunicorn dragonsden.wsgi:application
      --bind 0.0.0.0:6776
      --workers 2
      --timeout 120
      "
    volumes:
      - .:/app
    ports:
      - "6776:6776"